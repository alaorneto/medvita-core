# CI do Medvita Core: lint, checks do Django, testes no PostgreSQL com a role runtime e diagnóstico
# dos quatro pacotes. O núcleo vem do repositório público do Skeleton, na tag de uma release
# publicada (SKELETON_REF); o repositório não contém cópia dele.
# As senhas abaixo são de um container descartável do próprio job, não segredos.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tag da release do núcleo instalada: é a versão mínima de compatibility.skeleton dos manifestos
  # e a referência do AGENTS.md da raiz; as três sobem na mesma mudança.
  SKELETON_REF: v0.8.0
  SKELETON_REPOSITORY: alaorneto/skeleton
  RUFF_VERSION: "0.17.4"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - run: python -m pip install "ruff==${RUFF_VERSION}"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_PASSWORD: ci-superuser-only
          # Container descartável: não espera o disco, e a tabela de locks comporta um worker por
          # vCPU recriando o schema ao mesmo tempo a partir do modelo (pg_dump).
          POSTGRES_INITDB_ARGS: >-
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off
            -c max_locks_per_transaction=2048
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DJANGO_SETTINGS_MODULE: skeleton.testing.host.settings
      SKELETON_DEV_APPS: >-
        ${{ github.workspace }}/med_patients,${{ github.workspace }}/med_scheduling,${{ github.workspace }}/med_records,${{ github.workspace }}/med_finance,${{ github.workspace }}/tests/apps/med_example
      SKELETON_BUNDLED_APPS: calendar,ledger
      SKELETON_TEST_ALLOW_SCHEMA_RESET: "1"
      SKELETON_TEST_ADMIN_DATABASE_URL: postgres://postgres:ci-superuser-only@127.0.0.1:5432/postgres
      SKELETON_TEST_OWNER_PASSWORD: ci-owner
      SKELETON_TEST_RUNTIME_PASSWORD: ci-runtime
      TEST_DATABASE_URL: postgres://skeleton_runtime:ci-runtime@127.0.0.1:5432/ci_skeleton_test
      TEST_MIGRATION_DATABASE_URL: postgres://skeleton_owner:ci-owner@127.0.0.1:5432/ci_skeleton_test
      WORKERS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - name: Cliente PostgreSQL (pg_dump do modelo do schema)
        # O cliente da distribuição pode ser mais novo que o servidor: pg_dump lê servidores
        # antigos, e o conftest descarta o ajuste de sessão que o servidor 16 não conhece.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      - name: Instalar o núcleo e as ferramentas de teste
        run: |
          python -m pip install "django-skeleton @ git+https://github.com/${SKELETON_REPOSITORY}@${SKELETON_REF}"
          python -m pip install pytest==9.2.0 pytest-django==4.14.0 pytest-xdist==3.8.0
      # Quando a release do núcleo anexar o wheel:
      # - run: python -m pip install "https://github.com/${SKELETON_REPOSITORY}/releases/download/v${SKELETON_VERSION}/django_skeleton-${SKELETON_VERSION}-py3-none-any.whl"
      - name: Provisionar os bancos de teste (um por worker)
        run: |
          python -m skeleton.testing.database provision --database ci_skeleton_test
          for worker in $(seq 0 $((WORKERS - 1))); do
            python -m skeleton.testing.database provision --database "ci_gw${worker}_skeleton_test"
          done
      - name: Checks do Django e do núcleo
        run: python -m django check --fail-level WARNING
      - name: Nenhuma migration pendente
        run: python -m django makemigrations --check --dry-run
      - name: Testes
        run: python -m pytest -q -n "${WORKERS}"

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
      - run: python -m pip install "django-skeleton @ git+https://github.com/${SKELETON_REPOSITORY}@${SKELETON_REF}"
      - name: Diagnóstico de cada pacote na revisão commitada
        run: |
          for package in med_patients med_scheduling med_records med_finance; do
            python -m skeleton.system.packages doctor "${package}" --git-ref HEAD
          done
      - name: Tema Medvita da instância (o mesmo leitor da instalação; sem banco, por isso --skip-checks)
        env:
          DJANGO_SETTINGS_MODULE: skeleton.testing.host.settings
        run: |
          python -m django appearance --skip-checks check-package med_patients/themes/medvita
          python -m django appearance --skip-checks build-package med_patients/themes/medvita --output "${RUNNER_TEMP}/medvita-theme.zip"
      - name: Pacotes de teste sem os arquivos de desenvolvimento
        # Chave descartável do próprio job: o pacote não é publicado, só conferido.
        run: |
          python -m skeleton.system.packages keygen --private-key "${RUNNER_TEMP}/ci.pem" --public-key "${RUNNER_TEMP}/ci.pub.pem"
          for package in med_patients med_scheduling med_records med_finance; do
            python -m skeleton.system.packages build --app-root "${package}" --git-ref HEAD               --output "${RUNNER_TEMP}/${package}.skapp" --private-key "${RUNNER_TEMP}/ci.pem"
            python tools/check_package.py "${RUNNER_TEMP}/${package}.skapp" "${package}"
          done
      - name: Ensaio da publicação (validar, inspecionar, extrair e indexar com a chave descartável)
        run: |
          printf '{"katua-tech": "ci.pub.pem"}' > "${RUNNER_TEMP}/trust.json"
          for package in med_patients med_scheduling med_records med_finance; do
            python -m skeleton.system.packages validate --trust-store "${RUNNER_TEMP}/trust.json" "${RUNNER_TEMP}/${package}.skapp"
            python -m skeleton.system.packages inspect --trust-store "${RUNNER_TEMP}/trust.json" "${RUNNER_TEMP}/${package}.skapp" > /dev/null
            python -m skeleton.system.packages extract --trust-store "${RUNNER_TEMP}/trust.json"               --destination "${RUNNER_TEMP}/extracted/${package}" "${RUNNER_TEMP}/${package}.skapp" > /dev/null
            test -f "${RUNNER_TEMP}/extracted/${package}/manifest.json" || find "${RUNNER_TEMP}/extracted/${package}" -name manifest.json | grep -q .
          done
          python -m skeleton.system.packages index --output "${RUNNER_TEMP}/index.json"             --private-key "${RUNNER_TEMP}/ci.pem" --trust-store "${RUNNER_TEMP}/trust.json" --publisher katua-tech             --expires-at "$(date -u -d '+7 days' +%Y-%m-%dT%H:%M:%SZ)" --generation 1             "${RUNNER_TEMP}"/med_*.skapp
          python -m skeleton.system.packages validate-index --trust-store "${RUNNER_TEMP}/trust.json" "${RUNNER_TEMP}/index.json"

  # Agregador exigido pelo ruleset da main: falha se qualquer job acima falhar.
  ci:
    name: CI
    if: always()
    needs: [lint, test, packages]
    runs-on: ubuntu-latest
    steps:
      - name: Resultado dos jobs
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.packages.result }}" = success
